<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Relatórios</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>📊 Relatórios</h1>

    <div class="card">

      <h2>🚿 Histórico de lavagens</h2>

      <div id="wash-history">
        Nenhum registro ainda
      </div>

    </div>


    <div class="card">

      <h2>✨ Histórico de etapas</h2>

      <div id="step-history">
        Nenhum registro ainda
      </div>

    </div>


    <div class="card">

      <h2>🌱 Histórico do tônico</h2>

      <div id="tonic-history">

      </div>

    </div>


    <button onclick="window.location.href='index.html'">

<!-- MODAL -->

<div id="edit-modal" class="hidden">

  <div class="modal-content">

    <h2>✏ Editar registro</h2>

    <label>

      Data

      <input
        type="date"
        id="edit-date"
      >

    </label>


    <label>

      Hora

      <input
        type="time"
        id="edit-time"
      >

    </label>


    <div class="modal-buttons">

      <button id="cancel-edit">

        Cancelar

      </button>

      <button id="save-edit">

        Salvar

      </button>

    </div>

  </div>

</div>
  
  <script src="reports.js"></script>

</body>

</html>
