<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Cronograma</title>

  <link rel="manifest" href="manifest.json">

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>✨ Meu Cronograma</h1>


    <!-- LAVAGEM -->

    <div class="card" id="wash-card">

      <h2>🚿 Última lavagem</h2>

      <p id="last-wash">
        Hoje
      </p>

      <small id="wash-history-preview">
        Nenhuma lavagem ainda
      </small>

      <button id="wash-btn" type="button">
        ✔ Lavei hoje
      </button>

    </div>


    <!-- PRÓXIMA ETAPA -->

    <div class="card" id="schedule-card">

      <div class="card-title-row">

        <h2>✨ Próxima etapa</h2>

        <button id="toggle-schedule-config" class="icon-btn" type="button">
          ⚙
        </button>

      </div>

      <p id="next-step">
        💧 Hidratação
      </p>

      <small id="last-step">
        Nenhuma etapa ainda
      </small>

      <button id="step-btn" type="button">
        ✔ Etapa feita
      </button>

      <div id="schedule-config-panel" class="hidden">

        <p class="config-help">
          Clique nas etapas para montar a nova sequência.
        </p>

        <div class="sequence-buttons">

          <button class="seq-btn" data-step="H" type="button">
            <span>💧</span>
            <small>Hidratação</small>
          </button>

          <button class="seq-btn" data-step="N" type="button">
            <span>🥥</span>
            <small>Nutrição</small>
          </button>

          <button class="seq-btn" data-step="R" type="button">
            <span>🧬</span>
            <small>Reconstrução</small>
          </button>

        </div>

        <div id="sequence-preview">
          Nova sequência:
        </div>

        <div class="config-actions">

          <button id="undo-btn" type="button">
            ↩ Apagar último
          </button>

          <button id="save-sequence-btn" type="button">
            ✔ Salvar sequência
          </button>

        </div>

      </div>

    </div>


    <!-- TÔNICO -->

    <div class="card" id="tonic-card">

      <div class="card-title-row">

        <h2>🌱 Tônico hoje</h2>

        <button id="toggle-tonic-config" class="icon-btn" type="button">
          ⚙
        </button>

      </div>

      <p id="tonic-status">
        Sim ✅
      </p>

      <small id="last-tonic">
        Nenhuma aplicação ainda
      </small>

      <button id="tonic-btn" type="button">
        ✔ Tônico OK
      </button>

      <div id="tonic-config-panel" class="hidden quick-config-panel">

        <label>
          Frequência de uso

          <select id="quick-tonic-frequency">
            <option value="24">A cada 24 horas</option>
            <option value="48">A cada 48 horas</option>
            <option value="72">A cada 72 horas</option>
            <option value="168">1 vez por semana</option>
          </select>

        </label>

        <label>
          Usar por quantos meses?

          <input
            type="number"
            id="quick-tonic-use-months"
            min="1"
          >

        </label>

        <label>
          Pausar por quantos meses?

          <input
            type="number"
            id="quick-tonic-pause-months"
            min="0"
          >

        </label>

        <button id="save-tonic-config" type="button">
          ✔ Salvar tônico
        </button>

      </div>

    </div>


    <!-- OILING -->

    <div class="card" id="oiling-card">

      <div class="card-title-row">

        <h2>🛢️ Oiling hoje</h2>

        <button id="toggle-oiling-config" class="icon-btn" type="button">
          ⚙
        </button>

      </div>

      <p id="oiling-status">
      Sim ✅
      </p>

      <small id="last-oiling">
        Nenhum oiling ainda
      </small>

      <button id="oiling-btn" type="button">
        ✔ Oiling OK
      </button>

      <div id="oiling-config-panel" class="hidden quick-config-panel">

        <label>
          Frequência de uso

          <select id="quick-oiling-frequency">
            <option value="7">1 vez por semana</option>
            <option value="15">A cada 15 dias</option>
            <option value="30">1 vez por mês</option>
          </select>

        </label>

        <label>
          Fazer por quantos meses?

          <input
            type="number"
            id="quick-oiling-use-months"
            min="1"
          >

        </label>

        <label>
          Pausar por quantos meses?

          <input
            type="number"
            id="quick-oiling-pause-months"
            min="0"
          >

        </label>

        <button id="save-oiling-config" type="button">
          ✔ Salvar oiling
        </button>

      </div>

    </div>


    <!-- RELATÓRIOS -->

    <button id="reports-btn" type="button">
      📊 Ver relatórios
    </button>


    <!-- CONFIGURAÇÕES GERAIS -->

    <button id="settings-btn" type="button">
      ⚙ Editar rotina
    </button>

  </div>

  <script src="script.js"></script>

</body>

</html>
