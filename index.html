<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Cronograma</title>

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="card">

    <h1>✨ Meu Cronograma</h1>

    <p class="subtitle">
      Próxima lavagem:
    </p>

    <h2 id="today-task">
      💧 Hidratação
    </h2>


    <button id="done-btn">
      ✔ Lavei hoje
    </button>


    <button id="config-btn">
      ⚙ Configurar sequência
    </button>


    <div id="config-panel" class="hidden">

      <h3>Sua sequência</h3>

      <input
        type="text"
        id="sequence-input"
        placeholder="Ex: H N H R"
      >

      <button id="save-config">
        💾 Salvar sequência
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
