<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Cronograma</title>

  <link rel="manifest" href="manifest.json">

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
  rel="stylesheet"
>
  
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>✨ Meu Cronograma</h1>

    <!-- TÔNICO -->

    <div class="card">

      <h2>🌱 Tônico hoje</h2>

      <p id="tonic-status">
        Sim
      </p>

     <small id="last-tonic">
       Nenhuma aplicação ainda
     </small>
      
      <button id="tonic-btn">
        ✔ Tônico OK
      </button>

    </div>


    <!-- PRÓXIMA ETAPA -->

    <div class="card">

      <h2>✨ Próxima etapa</h2>

      <p id="next-step">
        💧 Hidratação
      </p>
      <small id="last-step">
       Nenhuma etapa ainda
      </small>

      <button id="step-btn">
        ✔ Etapa feita
      </button>

    </div>


    <!-- LAVAGEM -->

    <div class="card">

      <h2>🚿 Última lavagem</h2>

      <p id="last-wash">
        Hoje
      </p>

      <small id="wash-history-preview">
        Nenhuma lavagem ainda
      </small>
      
      <button id="wash-btn">
        ✔ Lavei hoje
      </button>

    </div>

    <button id="reports-btn">

  📊 Ver relatórios

    </button>
    
    <!-- CONFIG -->

    <div class="card">

      <div id="config-header">

  <h2>⚙ Configurações</h2>

  <span id="toggle-config">
    ▼
  </span>

</div>
      <div id="config-content">
      <div class="sequence-buttons">

        <button class="seq-btn" data-step="H">
          💧 H
        </button>

        <button class="seq-btn" data-step="N">
          🥥 N
        </button>

        <button class="seq-btn" data-step="R">
          🧬 R
        </button>

      </div>


      <div id="sequence-preview">
        Sua sequência:
      </div>


      <div class="config-actions">

        <button id="undo-btn">
          ↩ Apagar último
        </button>

        <button id="save-sequence-btn">
          ✔ Sequência OK
        </button>
        <button id="reset-btn">
  🔄 Reiniciar rotina
</button>

      </div>

      </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
