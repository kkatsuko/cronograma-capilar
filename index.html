<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Cronograma</title>

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="card">

    <h1>✨ Meu Cronograma</h1>

    <p class="subtitle">
      Hoje é dia de:
    </p>

    <h2 id="today-task">
      ✨ Configure seu cronograma
    </h2>


    <button id="done-btn">
      ✔ Concluir
    </button>


    <button id="config-btn">
      ⚙ Configurar cronograma
    </button>


    <div id="config-panel" class="hidden">

      <h3>Dias de lavagem</h3>

      <div class="week-buttons">

        <button class="day-btn" data-day="1">
          Seg
        </button>

        <button class="day-btn" data-day="2">
          Ter
        </button>

        <button class="day-btn" data-day="3">
          Qua
        </button>

        <button class="day-btn" data-day="4">
          Qui
        </button>

        <button class="day-btn" data-day="5">
          Sex
        </button>

        <button class="day-btn" data-day="6">
          Sáb
        </button>

        <button class="day-btn" data-day="0">
          Dom
        </button>

      </div>


      <h3>Sequência</h3>

      <input
        type="text"
        id="sequence-input"
        placeholder="Ex: H N H R"
      >


      <button id="save-config">
        💾 Salvar cronograma
      </button>

    </div>


    <div class="buttons">

      <button class="type-btn">
        💧 H
      </button>

      <button class="type-btn">
        🥥 N
      </button>

      <button class="type-btn">
        🧬 R
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
